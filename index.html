<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a9dfff">
  <title>CameraTest01 — 小さな鳥</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #a9dfff; overflow: hidden; }
    .camera {
      position: fixed;
      inset: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .camera[hidden] { display: none; }
    .camera-controls {
      position: fixed;
      z-index: 2;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      margin: auto;
      max-width: 440px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .94);
      color: #304d60;
      font: 14px/1.6 system-ui, sans-serif;
      text-align: center;
    }
    .camera-controls p { margin: 0 0 8px; }
    .camera-controls button, #fly-again {
      min-height: 44px;
      padding: 8px 20px;
      border: 0;
      border-radius: 8px;
      background: #304d60;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    #fly-again {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      z-index: 2;
    }
    #fly-again:disabled { opacity: .65; cursor: default; }
    main {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .bird {
      position: fixed;
      top: 0;
      left: 0;
      width: 70vw;
      max-width: none;
      height: auto;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }
    .camera-diagnostics {
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      z-index: 3;
      top: 72px;
      left: 12px;
      right: 12px;
      max-width: 520px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      color: #304d60;
      font: 12px/1.5 system-ui, sans-serif;
    }
    .camera-diagnostics summary { cursor: pointer; min-height: 28px; }
    #camera-log {
      max-height: 25vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
      margin: 4px 0 0;
    }
    #pose-layer { position: fixed; inset: 0; z-index: 1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #pose-image { position: absolute; left: 0; top: 0; max-width: none; height: auto; pointer-events: none; -webkit-user-drag: none; }
    #photo-controls { position: fixed; z-index: 4; bottom: max(18px, env(safe-area-inset-bottom)); left: 12px; right: 12px; text-align: center; pointer-events: none; font: 14px/1.5 system-ui, sans-serif; }
    #photo-hint { display: table; margin: 0 auto 10px; padding: 5px 12px; border-radius: 20px; background: rgba(255,255,255,.92); color: #304d60; }
    #shutter { pointer-events: auto; width: 72px; height: 72px; border: 5px solid white; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #304d60, 0 2px 12px #0005; color: #304d60; font: bold 13px system-ui,sans-serif; }
    #shutter:disabled { opacity: .55; }
    #photo-result { position: fixed; inset: 0; z-index: 10; background: #152735; color: white; overflow: auto; padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); font: 15px/1.6 system-ui,sans-serif; text-align: center; }
    #photo-result h1 { margin: 4px 0 12px; font-size: 20px; }
    #photo-preview { display: block; max-width: 100%; max-height: 60vh; width: auto; height: auto; margin: 0 auto 12px; object-fit: contain; -webkit-touch-callout: default; }
    .photo-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .photo-actions button, .photo-actions a { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 10px; font: inherit; text-decoration: none; background: white; color: #304d60; cursor: pointer; }
    #photo-back { background: #344c5d; color: white; }
    #photo-result p { margin: 10px auto; max-width: 36em; }
    #pose-layer[hidden], #photo-controls[hidden], #photo-result[hidden], #photo-preview[hidden], #photo-share[hidden], #photo-download[hidden] { display: none; }
  </style>
</head>
<body>
  <video class="camera" autoplay muted playsinline hidden aria-hidden="true"></video>
  <button id="fly-again" type="button">もう一度飛ばす</button>
  <details class="camera-diagnostics" open>
    <summary>カメラ診断（タップで開閉）</summary>
    <pre id="camera-log" aria-label="カメラ診断ログ"></pre>
  </details>
  <div class="camera-controls">
    <p id="camera-status" role="status" aria-live="polite">カメラを開始すると、使用許可を求めます。</p>
    <button id="camera-start" type="button">カメラを開始</button>
  </div>
  <main>
    <img class="bird" id="glide-back" src="zenjiro/glide-back.png" width="1536" height="1024" alt="背中を見せて滑空する膳二郎" draggable="false">
    <img class="bird" id="glide-belly" src="zenjiro/glide-belly.png" width="1536" height="1024" alt="お腹を見せて上昇する膳二郎" draggable="false">
    <img class="bird" id="flyby-front" src="zenjiro/flyby-front.png" width="1536" height="1024" alt="正面から近づく膳二郎" draggable="false">
  </main>
  <div id="pose-layer" hidden aria-label="膳二郎の配置エリア。1本指で移動、2本指で拡大縮小">
    <img id="pose-image" alt="記念写真の膳二郎" draggable="false">
  </div>
  <div id="photo-controls" hidden>
    <p id="photo-hint" role="status">1本指で移動・2本指で大きさ調整</p>
    <button id="shutter" type="button" aria-label="記念写真を撮影" disabled>撮影</button>
  </div>
  <section id="photo-result" role="dialog" aria-modal="true" aria-labelledby="photo-title" hidden>
    <h1 id="photo-title">撮影した写真</h1>
    <img id="photo-preview" alt="カメラ映像と膳二郎を合成した記念写真" hidden>
    <p id="photo-save-hint" role="status">写真を作成しています…</p>
    <div class="photo-actions">
      <button id="photo-share" type="button" hidden>共有して保存</button>
      <a id="photo-download" hidden>画像を保存</a>
      <button id="photo-back" type="button">撮影画面に戻る</button>
    </div>
  </section>
  <script>
    const camera = document.querySelector('.camera');
    const cameraControls = document.querySelector('.camera-controls');
    const cameraStatus = document.querySelector('#camera-status');
    const cameraStart = document.querySelector('#camera-start');
    let cameraStream = null;
    let cameraStarting = false;
    const cameraLog = document.querySelector('#camera-log');
    const diagnosticLines = [];
    let cameraAttempt = 0;

    function logCamera(message) {
      diagnosticLines.push(`[${new Date().toLocaleTimeString()} / 試行${cameraAttempt}] ${message}`);
      if (diagnosticLines.length > 80) diagnosticLines.shift();
      cameraLog.textContent = diagnosticLines.join('\n');
      cameraLog.scrollTop = cameraLog.scrollHeight;
    }

    function logVideoState(label) {
      logCamera(`${label}: videoWidth=${camera.videoWidth}, videoHeight=${camera.videoHeight}, readyState=${camera.readyState}, paused=${camera.paused}, hidden=${camera.hidden}`);
    }

    function logCameraError(stage, error) {
      const name = error && error.name ? error.name : '名前なし';
      const message = error && error.message ? error.message : String(error);
      const code = error && error.code !== undefined ? ` / code=${error.code}` : '';
      const constraint = error && error.constraint ? ` / constraint=${error.constraint}` : '';
      logCamera(`${stage}: エラー名=${name} / 詳細=${message}${code}${constraint}`);
      logVideoState('エラー発生時');
      document.querySelector('.camera-diagnostics').open = true;
    }

    logCamera(`診断開始: secureContext=${window.isSecureContext}, getUserMedia=${!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)}`);
    ['loadedmetadata', 'loadeddata', 'playing', 'waiting', 'stalled', 'resize'].forEach((type) => {
      camera.addEventListener(type, () => logVideoState(`videoイベント ${type}`));
    });

    function stopCamera() {
      const stream = cameraStream;
      cameraStream = null;
      if (stream) stream.getTracks().forEach((track) => track.stop());
      camera.srcObject = null;
      camera.hidden = true;
    }

    function cameraFailed(message) {
      logCamera(`フォールバック: ${message}`);
      stopCamera();
      cameraControls.hidden = false;
      cameraStatus.textContent = message + ' 青空の背景で「もう一度飛ばす」から滑空を確認できます。';
      cameraStart.textContent = 'カメラを再試行';
    }

    async function startCamera() {
      if (cameraStarting || cameraStream) return;
      cameraAttempt += 1;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        logCameraError('getUserMedia 利用不可', { name: 'NotSupportedError', message: 'navigator.mediaDevices.getUserMedia がありません。' });
        cameraFailed('この環境ではカメラを利用できません。対応ブラウザーのHTTPSまたはlocalhostで開いてください。');
        return;
      }
      cameraStarting = true;
      cameraStart.disabled = true;
      cameraStatus.textContent = 'カメラの使用を許可してください。';
      let cameraStage = 'getUserMedia';
      try {
        logCamera('getUserMedia: 開始（背面カメラ優先・音声なし）');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        logCamera(`getUserMedia: 成功 / videoTracks=${stream.getVideoTracks().length}, active=${stream.active}`);
        cameraStage = '映像の接続';
        cameraStream = stream;
        stream.getVideoTracks().forEach((track) => {
          track.addEventListener('ended', () => {
            logCamera('映像トラック: ended');
            if (cameraStream === stream) cameraFailed('カメラ映像が停止しました。');
          });
        });
        camera.srcObject = stream;
        // Safariで非表示のvideoの再生待ちにしない。
        camera.hidden = false;
        cameraStage = 'video.play()';
        logCamera('video.play(): 開始');
        await camera.play();
        logCamera('video.play(): 成功');
        logVideoState('再生成功直後');
        if (cameraStream !== stream) return;
        // 映像を描画する機会を作ってから鳥を飛ばす。
        cameraStage = '再生後の処理';
        await new Promise((resolve) => requestAnimationFrame(resolve));
        if (cameraStream !== stream) return;
        logVideoState('描画フレーム後');
        cameraControls.hidden = true;
        cameraStage = '鳥の飛行開始';
        flyBird();
      } catch (error) {
        logCameraError(`${cameraStage}: 失敗`, error);
        const messages = {
          NotAllowedError: 'カメラの使用が許可されませんでした。ブラウザーや端末の設定でカメラを許可してから再試行してください。',
          NotFoundError: '利用できるカメラが見つかりません。',
          NotReadableError: 'カメラを開始できません。他のアプリで使用中の場合は終了して再試行してください。',
          OverconstrainedError: 'このカメラは指定された映像設定に対応していません。',
          SecurityError: 'ブラウザーのセキュリティ設定によりカメラを利用できません。'
        };
        cameraFailed(messages[error.name] || 'カメラ映像を開始できませんでした。');
      } finally {
        cameraStarting = false;
        cameraStart.disabled = false;
      }
    }

    cameraStart.addEventListener('click', startCamera);
    camera.addEventListener('error', () => {
      logCameraError('video errorイベント', camera.error || { name: 'MediaError', message: '詳細情報なし' });
      cameraFailed('カメラ映像を表示できませんでした。');
    });
    window.addEventListener('pagehide', () => {
      finishFlight();
      stopCamera();
      cameraControls.hidden = false;
      cameraStatus.textContent = 'カメラを開始すると、使用許可を求めます。';
    });

    const birds = [document.querySelector('#glide-back'), document.querySelector('#glide-belly'), document.querySelector('#flyby-front')];
    const flyAgain = document.querySelector('#fly-again');
    let flightFrame = null;
    let flightRun = 0;

    function finishFlight(keepCloseup = false) {
      flightRun += 1;
      if (flightFrame !== null) cancelAnimationFrame(flightFrame);
      flightFrame = null;
      if (!keepCloseup) birds.forEach((bird) => { bird.style.visibility = 'hidden'; bird.style.filter = ''; });
      flyAgain.disabled = false;
    }

    function imageReady(image) {
      if (image.complete) return image.naturalWidth > 0
        ? Promise.resolve() : Promise.reject(new Error('画像を読み込めません: ' + image.getAttribute('src')));
      return new Promise((resolve, reject) => {
        image.addEventListener('load', resolve, { once: true });
        image.addEventListener('error', () => reject(new Error('画像を読み込めません: ' + image.getAttribute('src'))), { once: true });
      });
    }

    function bezier(points, t) {
      const u = 1 - t;
      return {
        x: u*u*u*points[0][0] + 3*u*u*t*points[1][0] + 3*u*t*t*points[2][0] + t*t*t*points[3][0],
        y: u*u*u*points[0][1] + 3*u*u*t*points[1][1] + 3*u*t*t*points[2][1] + t*t*t*points[3][1]
      };
    }

    async function flyBird() {
      finishFlight();
      const run = flightRun;
      flyAgain.disabled = true;
      try {
        document.body.dataset.scene = 'flight';
        await Promise.all(birds.map(imageReady));
        if (run !== flightRun) return;
        // 開始時の画面寸法を固定。Safariのツールバーによるresizeで飛行を中断しない。
        const w = window.innerWidth;
        const h = window.innerHeight;
        const size = Math.min(w * .72, 340);
        const margin = size * .85;
        birds.forEach((bird) => { bird.style.width = size + 'px'; });
        const paths = [
          [[w + margin, h*.06], [w*.65, h*.14], [w*.12, h*.57], [-margin, h*.78]],
          [[-margin, h*.63], [w*.30, h*.40], [w*.66, h*.20], [w + margin, -size*.65]]
        ];
        const durations = [1400, 1550];
        const gap = 250;
        const secondStart = durations[0] + gap;
        const thirdStart = secondStart + durations[1] + 160;
        const thirdDuration = 1350;
        const totalDuration = thirdStart + thirdDuration;
        let startedAt = null;
        const front = birds[2];
        const frontRatio = front.naturalHeight / front.naturalWidth;
        function frontAt(x, y, width, angle, blur) {
          front.style.width = width + 'px';
          front.style.transform = 'translate(' + (x-width/2) + 'px, ' + (y-width*frontRatio/2) + 'px) rotate(' + angle + 'deg)';
          front.style.filter = blur > 0 ? 'blur(' + blur + 'px)' : '';
          front.style.visibility = 'visible';
        }
        const smooth = (p) => p*p*(3-2*p);
        function frame(now) {
          if (run !== flightRun) return;
          if (startedAt === null) startedAt = now;
          const elapsed = now - startedAt;
          birds.forEach((bird) => { bird.style.visibility = 'hidden'; });
          if (elapsed < thirdStart) {
            const index = elapsed < durations[0] ? 0 : 1;
            const local = index === 0 ? elapsed : elapsed - secondStart;
            if (local >= 0 && local < durations[index]) {
              const p = local / durations[index];
              const t = index === 0 ? p - .025*Math.sin(Math.PI*p) : .85*p + .15*p*p;
              const point = bezier(paths[index], t);
              const bank = index === 0 ? 5*Math.sin(Math.PI*t)-4*t : -7*Math.sin(Math.PI*t);
              birds[index].style.transform = 'translate(' + (point.x-size/2) + 'px, ' + (point.y-size/3) + 'px) rotate(' + bank + 'deg)';
              birds[index].style.visibility = 'visible';
            }
          } else if (elapsed < thirdStart + thirdDuration) {
            const p = (elapsed-thirdStart)/thirdDuration;
            // 遠景で少し沈み、後半の急拡大と上への抜けで奥→手前を表現。
            const rush = Math.pow(Math.max(0, (p-.3)/.7), 3);
            const width = w*(.075 + .16*p + 4.8*rush);
            const x = w*(.49 + .055*Math.sin(Math.PI*p) - .02*rush);
            const y = h*(.32 + .17*Math.sin(Math.PI*p) - 2.8*Math.pow(p, 7));
            frontAt(x,y,width,-5*Math.sin(Math.PI*p),0);
          }
          if (elapsed < totalDuration) flightFrame = requestAnimationFrame(frame);
          else {
            finishFlight();
            // 3羽目終了後の撮影画面接続位置。カメラは停止せず、映像を背景に残す。
            document.body.dataset.scene = 'capture-ready';
            window.dispatchEvent(new CustomEvent('zenjiro:scene-transition', {
              detail: { next: 'capture', cameraReady: !!cameraStream, poseImage: null }
            }));
          }
        }
        flightFrame = requestAnimationFrame(frame);
      } catch (error) {
        if (run !== flightRun) return;
        finishFlight();
        logCameraError('滑空画像の準備', error);
        cameraControls.hidden = false;
        cameraStatus.textContent = '滑空画像を読み込めません。zenjiroフォルダーのPNGを確認してください。';
      }
    }

    flyAgain.addEventListener('click', flyBird);
  </script>
  <script>
    // 飛行・カメラの既存コードから独立した、記念写真用レイヤー。
    const normalPoses = [
      'stand-right.png', 'stand-left.png', 'stand-front.png',
      'hover-right.png', 'hover-left.png', 'cozy-front-right.png',
      'cozy-front-left.png', 'tilt-right.png', 'tilt-left.png',
      'wave-right.png', 'wave-left.png'
    ];
    const poseLayer = document.querySelector('#pose-layer');
    const poseImage = document.querySelector('#pose-image');
    const photoControls = document.querySelector('#photo-controls');
    const photoHint = document.querySelector('#photo-hint');
    const shutter = document.querySelector('#shutter');
    const photoResult = document.querySelector('#photo-result');
    const photoPreview = document.querySelector('#photo-preview');
    const saveHint = document.querySelector('#photo-save-hint');
    const shareButton = document.querySelector('#photo-share');
    const downloadPhoto = document.querySelector('#photo-download');
    const backToCamera = document.querySelector('#photo-back');
    const photoPointers = new Map();
    let posePlacement = { x: 0, y: 0, width: 160 };
    let poseGesture = null;
    let poseReady = false;
    let poseRequest = 0;
    let photoBusy = false;
    let photoFile = null;
    let photoURL = null;

    function renderPose() {
      poseImage.style.width = posePlacement.width + 'px';
      poseImage.style.transform = `translate(${posePlacement.x}px, ${posePlacement.y}px)`;
    }

    function cameraCanCapture() {
      return !!cameraStream && cameraStream.active !== false && !camera.hidden
        && camera.readyState >= 2 && camera.videoWidth > 0 && camera.videoHeight > 0;
    }

    function updateShutter() {
      shutter.disabled = !poseReady || photoBusy || !cameraCanCapture();
      shutter.hidden = !cameraCanCapture();
      photoControls.style.bottom = cameraCanCapture() ? '' : '145px';
      if (!poseReady || photoBusy) return;
      photoHint.textContent = cameraCanCapture()
        ? '1本指で移動・2本指で大きさ調整'
        : '配置は確認できます。撮影にはカメラの開始が必要です。';
    }

    function clearPhotoGesture() {
      photoPointers.forEach((point, id) => {
        if (poseLayer.hasPointerCapture(id)) poseLayer.releasePointerCapture(id);
      });
      photoPointers.clear();
      poseGesture = null;
    }

    function hidePose() {
      poseRequest += 1;
      poseReady = false;
      poseLayer.hidden = true;
      photoControls.hidden = true;
      clearPhotoGesture();
      updateShutter();
    }

    async function showRandomPose() {
      hidePose();
      const request = poseRequest;
      photoControls.hidden = false;
      photoHint.textContent = '膳二郎がポーズを決めています…';
      // この飛行1回につき1度だけ抽選。移動・ピンチ・撮り直しでは再抽選しない。
      const file = normalPoses[Math.floor(Math.random() * normalPoses.length)];
      poseImage.src = 'zenjiro/' + file;
      try {
        await imageReady(poseImage);
        if (request !== poseRequest) return;
        const width = Math.min(window.innerWidth * .42, 240);
        const height = width * poseImage.naturalHeight / poseImage.naturalWidth;
        posePlacement = {
          x: window.innerWidth * .70 - width / 2,
          y: window.innerHeight * .65 - height / 2,
          width
        };
        renderPose();
        poseReady = true;
        poseLayer.hidden = false;
        updateShutter();
      } catch (error) {
        if (request !== poseRequest) return;
        photoHint.textContent = 'ポーズ画像を読み込めません。「もう一度飛ばす」で再試行してください。';
        logCameraError('決めポーズ画像', error);
      }
    }

    window.addEventListener('zenjiro:scene-transition', (event) => {
      if (event.detail.next === 'capture') showRandomPose();
    });
    // 再飛行やカメラの再起動で元の撮影レイヤーを残さない。
    new MutationObserver(() => {
      if (document.body.dataset.scene === 'flight') hidePose();
    }).observe(document.body, { attributes: true, attributeFilter: ['data-scene'] });
    ['playing', 'loadeddata', 'resize', 'emptied', 'error'].forEach((type) => {
      camera.addEventListener(type, updateShutter);
    });

    function beginPhotoGesture() {
      const points = Array.from(photoPointers.values());
      if (!points.length) { poseGesture = null; return; }
      const center = points.length === 1 ? points[0] : {
        x: (points[0].x + points[1].x) / 2,
        y: (points[0].y + points[1].y) / 2
      };
      poseGesture = {
        x: center.x, y: center.y,
        distance: points.length < 2 ? 0 : Math.hypot(points[1].x-points[0].x, points[1].y-points[0].y),
        placement: { ...posePlacement }
      };
    }

    poseLayer.addEventListener('pointerdown', (event) => {
      if (!poseReady || photoBusy || event.button !== 0 || photoPointers.size >= 2) return;
      event.preventDefault();
      photoPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      poseLayer.setPointerCapture(event.pointerId);
      beginPhotoGesture();
    });

    poseLayer.addEventListener('pointermove', (event) => {
      if (!photoPointers.has(event.pointerId) || !poseGesture) return;
      event.preventDefault();
      photoPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const points = Array.from(photoPointers.values());
      const origin = poseGesture.placement;
      if (points.length === 1) {
        posePlacement.x = origin.x + points[0].x - poseGesture.x;
        posePlacement.y = origin.y + points[0].y - poseGesture.y;
      } else {
        const center = { x: (points[0].x+points[1].x)/2, y: (points[0].y+points[1].y)/2 };
        const distance = Math.hypot(points[1].x-points[0].x, points[1].y-points[0].y);
        const rawWidth = origin.width * distance / Math.max(1, poseGesture.distance);
        // 技術上の限界だけ設定。4pxから画面幅の20倍まで自由に配置可能。
        const width = Math.max(4, Math.min(window.innerWidth * 20, rawWidth));
        const ratio = width / origin.width;
        posePlacement = {
          x: center.x + (origin.x-poseGesture.x)*ratio,
          y: center.y + (origin.y-poseGesture.y)*ratio,
          width
        };
      }
      renderPose();
    });

    function endPhotoPointer(event) {
      if (!photoPointers.has(event.pointerId)) return;
      photoPointers.delete(event.pointerId);
      if (poseLayer.hasPointerCapture(event.pointerId)) poseLayer.releasePointerCapture(event.pointerId);
      beginPhotoGesture();
    }
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
      poseLayer.addEventListener(type, endPhotoPointer);
    });
    // PCでも同じポーズを拡縮できる。スマートフォンはピンチ操作。
    poseLayer.addEventListener('wheel', (event) => {
      if (!poseReady || photoBusy) return;
      event.preventDefault();
      const old = posePlacement.width;
      const width = Math.max(4, Math.min(window.innerWidth*20, old*Math.exp(-event.deltaY*.002)));
      const scale = width/old;
      posePlacement = { x: event.clientX+(posePlacement.x-event.clientX)*scale,
        y: event.clientY+(posePlacement.y-event.clientY)*scale, width };
      renderPose();
    }, { passive: false });

    function coverCrop(sourceWidth, sourceHeight, viewWidth, viewHeight) {
      const scale = Math.max(viewWidth/sourceWidth, viewHeight/sourceHeight);
      const width = viewWidth/scale;
      const height = viewHeight/scale;
      return { x: (sourceWidth-width)/2, y: (sourceHeight-height)/2, width, height };
    }

    shutter.addEventListener('click', async () => {
      if (!poseReady || photoBusy || !cameraCanCapture()) { updateShutter(); return; }
      clearPhotoGesture();
      photoBusy = true;
      updateShutter();
      let canvas;
      try {
        // DOMを写さず、videoのcoverトリミングとPNGのみを同じ座標系で合成する。
        const view = camera.getBoundingClientRect();
        const pose = poseImage.getBoundingClientRect();
        const crop = coverCrop(camera.videoWidth, camera.videoHeight, view.width, view.height);
        const resolution = Math.min(crop.width/view.width, crop.height/view.height,
          4096/Math.max(view.width,view.height), Math.sqrt(8000000/(view.width*view.height)));
        canvas = document.createElement('canvas');
        canvas.width = Math.max(1,Math.round(view.width*resolution));
        canvas.height = Math.max(1,Math.round(view.height*resolution));
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('画像の合成を開始できませんでした。');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(camera,crop.x,crop.y,crop.width,crop.height,0,0,canvas.width,canvas.height);
        const scaleX = canvas.width/view.width, scaleY = canvas.height/view.height;
        ctx.drawImage(poseImage,(pose.left-view.left)*scaleX,(pose.top-view.top)*scaleY,
          pose.width*scaleX,pose.height*scaleY);
        photoResult.hidden = false;
        photoPreview.hidden = true;
        shareButton.hidden = true;
        downloadPhoto.hidden = true;
        backToCamera.disabled = true;
        saveHint.textContent = '写真を作成しています…';
        const blob = await new Promise((resolve,reject) => canvas.toBlob(
          (value) => value ? resolve(value) : reject(new Error('画像を書き出せませんでした。')), 'image/jpeg', .96));
        if (photoURL) URL.revokeObjectURL(photoURL);
        const name = 'zenjiro-' + new Date().toISOString().replace(/[:.]/g,'-') + '.jpg';
        photoFile = new File([blob],name,{ type: blob.type });
        photoURL = URL.createObjectURL(blob);
        photoPreview.src = photoURL;
        photoPreview.hidden = false;
        downloadPhoto.href = photoURL;
        downloadPhoto.download = name;
        downloadPhoto.hidden = false;
        let canShareFile = false;
        try { canShareFile = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [photoFile] })); } catch (_) {}
        shareButton.hidden = !canShareFile;
        saveHint.textContent = canShareFile
          ? '「共有して保存」から「画像を保存」を選んでください。上の写真を長押しして保存することもできます。'
          : 'iPhoneでは上の写真を長押しして「写真に保存」を選んでください。PCでは「画像を保存」を押してください。';
        backToCamera.focus();
      } catch (error) {
        photoResult.hidden = true;
        photoHint.textContent = '撮影できませんでした。' + error.message;
        logCameraError('記念写真の撮影',error);
      } finally {
        if (canvas) { canvas.width = 1; canvas.height = 1; }
        photoBusy = false;
        backToCamera.disabled = false;
        shutter.disabled = !poseReady || !cameraCanCapture();
      }
    });

    shareButton.addEventListener('click', async () => {
      if (!photoFile) return;
      // エンコード済みのFileを使い、タップ直後のユーザー操作権限で共有画面を開く。
      try { await navigator.share({ files: [photoFile], title: '膳二郎との記念写真' }); }
      catch (error) {
        if (error.name !== 'AbortError') saveHint.textContent = '共有を開けませんでした。上の写真を長押しして保存してください。';
      }
    });
    backToCamera.addEventListener('click', () => {
      photoResult.hidden = true;
      clearPhotoGesture();
      updateShutter();
      shutter.focus();
    });
    photoResult.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !photoBusy) backToCamera.click();
      if (event.key !== 'Tab') return;
      const items = [shareButton, downloadPhoto, backToCamera].filter((item) => !item.hidden && !item.disabled);
      const first = items[0], last = items[items.length-1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
    window.addEventListener('pagehide', () => { hidePose(); photoResult.hidden = true; });
  </script>
</body>
</html>
