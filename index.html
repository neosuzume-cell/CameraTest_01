<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a9dfff">
  <title>CameraTest01 — 小さな鳥</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #a9dfff; }
    .camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .camera[hidden] { display: none; }
    .camera-controls {
      position: fixed;
      z-index: 2;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      margin: auto;
      max-width: 440px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .94);
      color: #304d60;
      font: 14px/1.6 system-ui, sans-serif;
      text-align: center;
    }
    .camera-controls p { margin: 0 0 8px; }
    .camera-controls button {
      min-height: 44px;
      padding: 8px 20px;
      border: 0;
      border-radius: 8px;
      background: #304d60;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .bird {
      display: block;
      width: min(70vw, 300px);
      height: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }
    .bird.is-dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <video class="camera" autoplay muted playsinline hidden aria-hidden="true"></video>
  <div class="camera-controls">
    <p id="camera-status" role="status" aria-live="polite">カメラを開始すると、使用許可を求めます。</p>
    <button id="camera-start" type="button">カメラを開始</button>
  </div>
  <main>
    <svg class="bird" viewBox="0 0 320 320" role="img" aria-labelledby="bird-title bird-description" xmlns="http://www.w3.org/2000/svg">
      <title id="bird-title">小さな鳥</title>
      <desc id="bird-description">明るい空色の背景に、黄色いくちばしと青い羽を持つ、丸い白い鳥が座っています。</desc>
      <ellipse cx="160" cy="278" rx="76" ry="9" fill="#6db9e5" opacity=".25"/>
      <path d="M132 253v20m0-2-12 5m12-5 10 5M184 253v20m0-2-10 5m10-5 12 5" fill="none" stroke="#d89a46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m224 205 48-24-9 43-44 12" fill="#4b93c4"/>
      <path d="M80 176c0-57 30-99 78-99 54 0 86 46 86 102 0 53-30 83-82 83-51 0-82-30-82-86Z" fill="#fffdf4"/>
      <path d="M139 83c-9-13-5-24 1-30 3 13 11 16 17 23 2-14 11-21 20-22-5 11-5 19-4 25" fill="#fffdf4"/>
      <path d="M94 169c-23 7-32 31-23 51 8 18 28 24 47 13 19-12 28-36 24-47-4-12-25-24-48-17Z" fill="#71b4df"/>
      <path d="M91 197c7 11 17 15 27 12" fill="none" stroke="#559dce" stroke-width="5" stroke-linecap="round"/>
      <circle cx="185" cy="139" r="7" fill="#304d60"/>
      <circle cx="187" cy="137" r="2" fill="white"/>
      <path d="m211 150 28 11-28 12Z" fill="#f2b84f" stroke-linejoin="round"/>
      <ellipse cx="187" cy="164" rx="12" ry="7" fill="#f7b8a7" opacity=".7"/>
    </svg>
  </main>
  <script>
    const camera = document.querySelector('.camera');
    const cameraControls = document.querySelector('.camera-controls');
    const cameraStatus = document.querySelector('#camera-status');
    const cameraStart = document.querySelector('#camera-start');
    let cameraStream = null;
    let cameraStarting = false;

    function stopCamera() {
      const stream = cameraStream;
      cameraStream = null;
      if (stream) stream.getTracks().forEach((track) => track.stop());
      camera.srcObject = null;
      camera.hidden = true;
    }

    function cameraFailed(message) {
      stopCamera();
      cameraControls.hidden = false;
      cameraStatus.textContent = message + ' 青空の背景で引き続き鳥を動かせます。';
      cameraStart.textContent = 'カメラを再試行';
    }

    async function startCamera() {
      if (cameraStarting || cameraStream) return;
      if (!navigator.mediaDevices?.getUserMedia) {
        cameraFailed('この環境ではカメラを利用できません。対応ブラウザーのHTTPSまたはlocalhostで開いてください。');
        return;
      }
      cameraStarting = true;
      cameraStart.disabled = true;
      cameraStatus.textContent = 'カメラの使用を許可してください。';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        cameraStream = stream;
        stream.getVideoTracks().forEach((track) => {
          track.addEventListener('ended', () => {
            if (cameraStream === stream) cameraFailed('カメラ映像が停止しました。');
          });
        });
        camera.srcObject = stream;
        await camera.play();
        if (cameraStream !== stream) return;
        camera.hidden = false;
        cameraControls.hidden = true;
      } catch (error) {
        const messages = {
          NotAllowedError: 'カメラの使用が許可されませんでした。ブラウザーや端末の設定でカメラを許可してから再試行してください。',
          NotFoundError: '利用できるカメラが見つかりません。',
          NotReadableError: 'カメラを開始できません。他のアプリで使用中の場合は終了して再試行してください。',
          OverconstrainedError: 'このカメラは指定された映像設定に対応していません。',
          SecurityError: 'ブラウザーのセキュリティ設定によりカメラを利用できません。'
        };
        cameraFailed(messages[error.name] || 'カメラ映像を開始できませんでした。');
      } finally {
        cameraStarting = false;
        cameraStart.disabled = false;
      }
    }

    cameraStart.addEventListener('click', startCamera);
    camera.addEventListener('error', () => cameraFailed('カメラ映像を表示できませんでした。'));
    window.addEventListener('pagehide', () => {
      stopCamera();
      cameraControls.hidden = false;
      cameraStatus.textContent = 'カメラを開始すると、使用許可を求めます。';
    });

    const bird = document.querySelector('.bird');
    let positionX = 0;
    let positionY = 0;
    let drag = null;

    bird.addEventListener('pointerdown', (event) => {
      if (drag !== null || !event.isPrimary || event.button !== 0) return;

      // 押した位置と現在の移動量を保存し、つかんだ瞬間の位置ずれを防ぐ。
      drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        originX: positionX,
        originY: positionY
      };
      bird.setPointerCapture(event.pointerId);
      bird.classList.add('is-dragging');
      event.preventDefault();
    });

    function moveBird(event) {
      if (drag === null || event.pointerId !== drag.pointerId) return;
      positionX = drag.originX + event.clientX - drag.startX;
      positionY = drag.originY + event.clientY - drag.startY;
      bird.style.transform = `translate(${positionX}px, ${positionY}px)`;
    }

    function stopDragging(event) {
      if (drag === null || event.pointerId !== drag.pointerId) return;
      drag = null;
      bird.classList.remove('is-dragging');
      if (bird.hasPointerCapture(event.pointerId)) {
        bird.releasePointerCapture(event.pointerId);
      }
    }

    bird.addEventListener('pointermove', moveBird);
    bird.addEventListener('pointerup', (event) => {
      moveBird(event);
      stopDragging(event);
    });
    bird.addEventListener('pointercancel', stopDragging);
    bird.addEventListener('lostpointercapture', stopDragging);
    bird.addEventListener('dragstart', (event) => event.preventDefault());
  </script>
</body>
</html>
